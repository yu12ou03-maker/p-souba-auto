name: 毎朝相場データ自動取得
on:
  schedule:
    - cron: '50 23 * * *' # 08:50 JST; earlier chance to finish before 09:45 bulletin
    - cron: '0 0 * * *' # 09:00 JST; GitHub may delay scheduled runs
    - cron: '7 0 * * *' # 09:07 JST recovery if no collection has started today
    - cron: '15 0 * * *' # 09:15 JST recovery if none started
    - cron: '30 0 * * *' # 09:30 JST final scheduled recovery if none started
  workflow_dispatch:
    inputs:
      capture_only:
        description: '撮影のみ（Driveへの送信なし）'
        type: boolean
        default: true
      dry_run:
        description: '撮影・ローカルOCR・検証のみ（Drive更新なし）'
        type: boolean
        default: true
  push:
    branches: [main, codex/souba-gemini-repair, codex/souba-schedule-recovery-20261102, codex/independent-souba-trigger-20261103]
    paths:
      - schedule_guard.py
      - take_screenshot.py
      - digit_templates.json
      - requirements.txt
      - tests/**
      - independent-trigger/**
      - .github/workflows/daily_screenshot.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: souba-production
  cancel-in-progress: false
jobs:
  verify-safety:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 起動・重複防止のみ検証（実取得・送信なし）
        run: |
          python3 -m unittest discover -s tests -p 'test_schedule_guard.py' -v
          node tests/test_independent_trigger.cjs
  take-screenshot:
    if: github.event_name != 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 本日の取得開始履歴を確認
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 schedule_guard.py
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.proceed == 'true'
        with:
          python-version: '3.11'
          cache: pip
      - name: 依存関係とChromiumを導入
        if: steps.guard.outputs.proceed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng fonts-dejavu-core
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: 検証テスト
        if: steps.guard.outputs.proceed == 'true'
        run: python -m unittest discover -s tests -v
      - name: ランキング撮影・ローカルOCR・正常時のみ保存
        if: steps.guard.outputs.proceed == 'true'
        env:
          P_SOUBA_USER: ${{ secrets.P_SOUBA_USER }}
          P_SOUBA_PASS: ${{ secrets.P_SOUBA_PASS }}
          GAS_URL: ${{ secrets.GAS_URL }}
          CAPTURE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.capture_only }}
          DRY_RUN: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          if [ "$CAPTURE_ONLY" = "true" ]; then
            python take_screenshot.py --capture-only
          elif [ "$DRY_RUN" = "true" ]; then
            python take_screenshot.py --dry-run
          else
            python take_screenshot.py
          fi
      - name: 診断画像・検証結果を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: souba-diagnostic-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 3

