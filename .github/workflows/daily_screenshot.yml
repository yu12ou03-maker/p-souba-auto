name: 毎朝相場データ自動取得
on:
  schedule:
    - cron: '0 0 * * *' # 09:00 JST; GitHub may delay scheduled runs
  workflow_dispatch:
    inputs:
      capture_only:
        description: '撮影のみ（Gemini・Driveへの送信なし）'
        type: boolean
        default: true
      dry_run:
        description: '撮影・ローカルOCR・検証のみ（Drive更新なし）'
        type: boolean
        default: true
  push:
    branches: [codex/souba-gemini-repair]
    paths:
      - take_screenshot.py
      - requirements.txt
      - tests/**
      - .github/workflows/daily_screenshot.yml
permissions:
  contents: read
concurrency:
  group: souba-${{ github.ref }}
  cancel-in-progress: false
jobs:
  take-screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: 依存関係とChromiumを導入
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng fonts-dejavu-core
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: 検証テスト
        run: python -m unittest discover -s tests -v
      - name: ランキング撮影・ローカルOCR・正常時のみ保存
        env:
          P_SOUBA_USER: ${{ secrets.P_SOUBA_USER }}
          P_SOUBA_PASS: ${{ secrets.P_SOUBA_PASS }}
          GAS_URL: ${{ secrets.GAS_URL }}
          CAPTURE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.capture_only }}
          DRY_RUN: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          if [ "$CAPTURE_ONLY" = "true" ]; then
            python take_screenshot.py --capture-only
          elif [ "$DRY_RUN" = "true" ]; then
            python take_screenshot.py --dry-run
          else
            python take_screenshot.py
          fi
      - name: 診断画像・検証結果を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: souba-diagnostic-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 3
