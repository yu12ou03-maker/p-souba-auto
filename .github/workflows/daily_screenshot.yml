name: 毎朝相場データ自動取得

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  take-screenshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 必要なライブラリのインストール
        run: |
          pip install playwright google-generativeai pillow
          playwright install --with-deps chromium

      - name: スクリーンショット撮影とAI解析を実行
        env:
          P_SOUBA_USER: ${{ secrets.P_SOUBA_USER }}
          P_SOUBA_PASS: ${{ secrets.P_SOUBA_PASS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python take_screenshot.py

      - name: 成果物を保存してコミット
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "毎朝の相場データ自動更新" && git push)
