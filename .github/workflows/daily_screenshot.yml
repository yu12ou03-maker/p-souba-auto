name: 毎朝スクショ自動撮影

on:
  schedule:
    # 日本時間の毎朝 07:00 に自動実行 (UTC 22:00)
    - cron: '0 22 * * *'
  # 手動で「今すぐ実行」もできるボタン
  workflow_dispatch:

jobs:
  take-screenshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 必要なライブラリのインストール
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: スクリーンショットの撮影を実行
        env:
          P_SOUBA_USER: ${{ secrets.P_SOUBA_USER }}
          P_SOUBA_PASS: ${{ secrets.P_SOUBA_PASS }}
        run: |
          python take_screenshot.py

      - name: 撮影したスクショを保存してコミット
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add screenshots/
          git diff --quiet && git diff --staged --quiet || (git commit -m "中古機相場スクショ自動更新" && git push)
